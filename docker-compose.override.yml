services:
  db:
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"

  web:
    environment:
      FLASK_ENV: development
    volumes:
      - ./app:/app/app
      - ./migrations:/app/migrations
    command: >
      sh -c "flask --app app db upgrade &&
             flask --app app run --host=0.0.0.0 --port=5000 --debug"
